version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
    open-pull-requests-limit: 5
    cooldown: { default-days: 7 }
    commit-message: { prefix: chore, include: scope }
    groups:
      minor-et-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
