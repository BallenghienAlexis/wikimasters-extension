name: PR Dependabot

# `pull_request` (jamais `pull_request_target`) : le code de la PR n'est ni extrait ni exécuté ici.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  gerer:
    name: gerer
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Mineure ou correctif : fusion en squash dès que la CI `ci` est verte (règles de main).
      - name: Activer la fusion automatique
        if: steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL" || echo "::warning::Fusion automatique indisponible (réglage « Allow auto-merge » du dépôt ?)"

      # Majeure : jamais fusionnée seule.
      - name: Étiqueter la mise à jour majeure
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh label create revue-manuelle --color d93f0b --description "Mise à jour majeure : à relire avant fusion" 2>/dev/null || true
          gh pr edit "$PR_URL" --add-label revue-manuelle
      - name: Commenter la mise à jour majeure
        if: steps.meta.outputs.update-type == 'version-update:semver-major' && github.event.action != 'synchronize'
        run: |
          gh pr comment "$PR_URL" --body "Mise à jour majeure : elle n'est pas fusionnée automatiquement. Relire les notes de version, vérifier la CI, puis fusionner à la main.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
